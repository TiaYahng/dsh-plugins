description:
  en: 'One Settings page for four jobs: token usage statistics, session-archive restore and permanent deletion, per-workspace memory, and the free-model pages from dsh-our-free-model embedded as a fourth tab Both halves of the model lane are vendored, so it needs no other plugin.'
  zh: '一个设置页装四件事：用量统计、归档会话的恢复与永久删除、按工作区管理记忆，以及八个免费模型页面（账号渠道、积分、账本、日志、网关）作为第四个页签。模型这一路的前后端都随插件内嵌，不需要另装别的插件。'