# 提交到插件列表用的条目文件
#
# 插件列表（awesome-dsh-plugin）不是市场本地索引：市场每次启动都从
# https://awesome-dsh-plugin.com/plugins.json 读目录，而那份目录由
# awesome-dsh-plugin/awesome-dsh-plugin 仓库的 data/plugins/*.yml 生成。
# 所以「能被搜到」= 往那个仓库提一个 PR，加一个文件。
#
# 提交步骤：
#   1. fork https://github.com/awesome-dsh-plugin/awesome-dsh-plugin
#   2. 把本文件**整个**复制为
#      data/plugins/TiaYahng__dsh-plugins--plugins-dsh-comprehensive-platform.yml
#      （本文件头部全是注释，末尾那段 YAML 就是全部内容，复制时不用删任何东西）
#   3. 提 PR。CI 自动校验：条目数 ≤3、dsh.bundle 清单存在、仓库年龄 ≥1 天、
#      YAML 格式与双语（zh 可省，维护者会补）、两个 README 能重新生成
#   4. 合并后站点自动重建；市场下次启动就能搜到
#
# 仓库侧已经就位的部分：
#   · GitHub topic: dsh-plugin（列表的发现入口，已加）
#   · 插件放在 plugins/ 下 —— CI 只认根包或 packages/ · plugins/ · apps/ 子包
#   · package.json 声明了 dsh.bundle、engines.dsh、dsh-plugin 关键字
#   · 第四页的前后端都随本插件内嵌（free-model/ 与 client.js 的 VENDOR 段），
#     来源、改动与上游许可见 free-model/NOTICE.md —— 不再是「还要装另一个插件」
#
# 提交时可能被问到的几点，先想好答案：
#   · category 选了 usage（用量统计是第一页）。维护者若觉得 session 或 memory
#     更贴切会直接改，不会因此打回。
#   · 描述里每一句都能对着代码核：四个页签、归档的恢复与永久删除、记忆按工作区、
#   · 第四页的前后端都随插件内嵌 —— 都是代码里实际做的事，没有形容词。
#   · 评审会看「依赖是否指向原作者」。内嵌的是对方插件的**前端那一半**，vendor
#     文件头写明了来源与十二处改动，运行时数据仍然只走对方的插件，没有重上传
#     对方的整包；package.json 里的 peer 也指向 npm 上的原包。
#   · 想让市场详情页有截图：在 plugins/dsh-comprehensive-platform/screenshots.json
#     里声明 1-8 张图（相对该文件的路径）。之后换图只需推自己的仓库，不用再提 PR。
#   · 发到 npm 不是收录的前提（列表照常收录），但发了才能按下载量排序，也能免掉
#     GitHub 源码安装的 allowBuilds 步骤。

